name: Scheduled ingestion

# The one automatic schedule for AI Trends, Funding and Launch Agent: once a
# day. Everything else is manual, from "Run now" on the admin dashboard.
#
# Once a day, in batches
# ----------------------
# A single call cannot read every source. AI news takes at most eight sources a
# run and funding stops at the Workers per-invocation subrequest ceiling, so one
# call covers a fraction of them. That was invisible at a 30-minute cadence and
# would not be at a daily one. So each step calls its endpoint repeatedly, each
# call a fresh invocation with a fresh budget, until a call reads nothing
# (`sourcesAttempted` 0) or eight calls have run. Each source's
# `poll_interval_minutes` is four hours (migration 20260910040000), well under a
# day, so every healthy source is due when this runs and the batches converge.
# The admin button does the same thing through lib/pipeline-sweep.ts.
#
# Both endpoints are idempotent -- `normalized_url` is unique and is checked
# before any expensive work -- so an overlapping or repeated run is harmless.
#
# The Cloudflare Cron Trigger (workers/ingest-scheduler)
# ------------------------------------------------------
# This file used to say that Worker never fires. On 2026-09-18 a `wrangler tail`
# caught it firing on its `*/10` schedule and getting 200 from both endpoints,
# so for a while there were two schedulers. Its trigger is now removed
# (`crons: []`) so this is the only one; the Worker stays deployed and costs
# nothing. Re-adding a cron there means two schedules again.
#
# Required repository secrets (Settings -> Secrets -> Actions), which must
# MATCH the Worker secrets of the same name:
#   gh secret set AI_NEWS_INGEST_SECRET
#   gh secret set FUNDING_INGEST_SECRET
#   gh secret set LAUNCH_AGENT_JOB_SECRET   (optional)
#
# VERCEL_PROTECTION_BYPASS (Settings -> Deployment Protection -> Protection
# Bypass for Automation on the Vercel project): since the 2026-09-19 rollback
# to Vercel ([[workers-free-cpu-limit]]), Vercel Attack Mode challenges this
# workflow's plain `curl` requests to bharathunt.org with a 429 "Security
# Checkpoint" page, same as it would any scripted visitor. Every scheduled run
# failed this way from 2026-09-19 to 2026-09-23. The bypass header exempts
# known automation from that challenge without weakening it for anyone else.

on:
  schedule:
    # 02:17 UTC = 07:47 IST, so the morning starts with fresh data. Off the top
    # of the hour, which is GitHub's busiest slot and the likeliest to be late.
    # lib/pipeline-sweep.ts shows this time on the admin dashboard: change both.
    - cron: "17 2 * * *"
  workflow_dispatch:

# Nothing here reads or writes the repository.
permissions:
  contents: read

concurrency:
  # Serialise without cancelling: an in-flight ingestion is doing useful work
  # and killing it mid-run wastes the fetches it has already made.
  group: scheduled-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Poll sources
    runs-on: ubuntu-latest
    # Eight batches per pipeline at up to five minutes each is the theoretical
    # worst case; a normal day takes a few minutes. Backstop only.
    timeout-minutes: 60

    env:
      SITE_URL: https://bharathunt.org
      MAX_BATCHES: 8
      VERCEL_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

    steps:
      - name: AI Trending
        env:
          INGEST_SECRET: ${{ secrets.AI_NEWS_INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${INGEST_SECRET}" ]; then
            echo "::error::AI_NEWS_INGEST_SECRET is not set in repository secrets. Add it with: gh secret set AI_NEWS_INGEST_SECRET"
            exit 1
          fi
          for batch in $(seq 1 "${MAX_BATCHES}"); do
            # The endpoint's 45s budget only stops it *starting* sources; one
            # source already under way can run well past it, and a batch of
            # eight due at once took over two minutes on 2026-09-18. A call
            # that outlasts this keeps running server-side and stamps what it
            # read, so the next batch simply carries on from there.
            code=$(curl -sS --max-time 300 -o response.json -w '%{http_code}' \
              -X POST "${SITE_URL}/api/ai-news/ingest" \
              -H "Authorization: Bearer ${INGEST_SECRET}" \
              -H "X-Ingest-Trigger: scheduled" \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}") || true
            echo "Batch ${batch}: HTTP ${code}"
            if [ "${code}" = "000" ]; then
              echo "::warning::AI news batch ${batch} did not answer in time; it continues server-side. Moving on."
              continue
            fi
            # The body is the run summary -- sources attempted, articles kept,
            # per-source errors. Truncated because a bad day is verbose.
            head -c 3000 response.json || true
            echo
            if [ "${code}" != "200" ]; then
              echo "::error::AI news ingestion returned HTTP ${code}"
              exit 1
            fi
            attempted=$(jq -r '.sourcesAttempted // 0' response.json)
            if [ "${attempted}" = "0" ]; then
              echo "Every due source read after ${batch} batch(es)."
              exit 0
            fi
          done
          echo "::warning::AI news stopped at ${MAX_BATCHES} batches with sources still due."

      - name: Funding Intelligence
        # Runs even when the step above failed: they are independent pipelines
        # and one being down is no reason to skip the other. `!cancelled()`
        # rather than `always()`, so a cancelled run really does stop.
        if: ${{ !cancelled() }}
        env:
          INGEST_SECRET: ${{ secrets.FUNDING_INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${INGEST_SECRET}" ]; then
            echo "::error::FUNDING_INGEST_SECRET is not set in repository secrets. Add it with: gh secret set FUNDING_INGEST_SECRET"
            exit 1
          fi
          for batch in $(seq 1 "${MAX_BATCHES}"); do
            # Same reasoning as the AI step: a slow batch is still working.
            code=$(curl -sS --max-time 300 -o response.json -w '%{http_code}' \
              -X POST "${SITE_URL}/api/funding/ingest" \
              -H "Authorization: Bearer ${INGEST_SECRET}" \
              -H "X-Ingest-Trigger: scheduled" \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}") || true
            echo "Batch ${batch}: HTTP ${code}"
            if [ "${code}" = "000" ]; then
              echo "::warning::Funding batch ${batch} did not answer in time; it continues server-side. Moving on."
              continue
            fi
            head -c 3000 response.json || true
            echo
            if [ "${code}" != "200" ]; then
              echo "::error::Funding ingestion returned HTTP ${code}"
              exit 1
            fi
            attempted=$(jq -r '.sourcesAttempted // 0' response.json)
            if [ "${attempted}" = "0" ]; then
              echo "Every due source read after ${batch} batch(es)."
              exit 0
            fi
          done
          echo "::warning::Funding stopped at ${MAX_BATCHES} batches with sources still due."

      - name: Launch Agent campaigns
        # Analyses campaigns queued when a product is approved. Optional: makers
        # opening Launch Agent analyse their own campaign on the spot, so until
        # the secret is set this step only notes that it skipped.
        if: ${{ !cancelled() }}
        env:
          JOB_SECRET: ${{ secrets.LAUNCH_AGENT_JOB_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${JOB_SECRET}" ]; then
            echo "::notice::LAUNCH_AGENT_JOB_SECRET is not set — skipping. Add it with: gh secret set LAUNCH_AGENT_JOB_SECRET"
            exit 0
          fi
          # A day's approvals can exceed one call's batch, so this drains the
          # queue the same way the ingestion steps do.
          for batch in $(seq 1 "${MAX_BATCHES}"); do
            code=$(curl -sS --max-time 60 -o response.json -w '%{http_code}' \
              -X POST "${SITE_URL}/api/launch-agent/jobs" \
              -H "Authorization: Bearer ${JOB_SECRET}" \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}")
            echo "Batch ${batch}: HTTP ${code}"
            head -c 2000 response.json || true
            echo
            if [ "${code}" != "200" ]; then
              echo "::error::Launch Agent jobs returned HTTP ${code}"
              exit 1
            fi
            attempted=$(jq -r '.attempted // 0' response.json)
            if [ "${attempted}" = "0" ]; then
              echo "Queue empty after ${batch} batch(es)."
              exit 0
            fi
          done
